name: CI

on:
  push:
    branches: ['release/**', 'hotfix/**', wiki-sync]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: ${{ github.ref != 'refs/heads/wiki-sync' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Luau tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo JohnnyMorganz/StyLua --pattern stylua-linux-x86_64.zip --dir "$RUNNER_TEMP/luau"
          gh release download --repo JohnnyMorganz/luau-lsp --pattern luau-lsp-linux-x86_64.zip --dir "$RUNNER_TEMP/luau"
          gh release download v0.11.0 --repo lune-org/lune --pattern lune-0.11.0-linux-x86_64.zip --dir "$RUNNER_TEMP/luau"
          mkdir -p "$HOME/.local/bin"
          unzip -o "$RUNNER_TEMP/luau/stylua-linux-x86_64.zip" -d "$HOME/.local/bin"
          unzip -o "$RUNNER_TEMP/luau/luau-lsp-linux-x86_64.zip" -d "$HOME/.local/bin"
          unzip -o "$RUNNER_TEMP/luau/lune-0.11.0-linux-x86_64.zip" -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stylua" "$HOME/.local/bin/luau-lsp" "$HOME/.local/bin/lune"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: vp check

      - run: vp run check:luau

      - run: vp run test:luau

      - run: vp run lint:prose

      - id: test
        name: Test with coverage gate
        run: vp test --coverage

      - name: Coverage summary
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: node --experimental-strip-types scripts/ci-summary.ts coverage

  mutation:
    name: Mutation testing
    if: ${{ github.ref != 'refs/heads/wiki-sync' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - id: stryker
        name: Mutation score gate
        run: vp exec stryker run

      - name: Mutation summary
        if: ${{ !cancelled() && steps.stryker.outcome != 'skipped' }}
        run: node --experimental-strip-types scripts/ci-summary.ts mutation

      - name: Upload mutation report
        if: ${{ !cancelled() && steps.stryker.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
