name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/**']

concurrency:
  group: wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish docs to the wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/
