name: Wiki pull

on:
  gollum:
  workflow_dispatch:

concurrency:
  group: wiki-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NOTE: an unreleased master commit. v5.0.6 has no pull mode. Repin to the first release that has it.
      - uses: Andrew-Chen-Wang/github-wiki-action@93c86ef70e8354bbd677185b355ba164cb29288f
        with:
          direction: pull
          path: docs/
      - uses: ./.github/actions/setup
      - run: vp fmt docs
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: wiki-sync
          delete-branch: true
          add-paths: docs
          title: 'docs(wiki): :memo: sync wiki edits into docs/'
          commit-message: 'docs(wiki): :memo: sync wiki edits into docs/'
          body: A page was edited in the GitHub wiki. This pull request brings the edit into `docs/`, the wiki source. `wiki.yml` refuses to publish until this merges.
      - if: ${{ steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref wiki-sync
