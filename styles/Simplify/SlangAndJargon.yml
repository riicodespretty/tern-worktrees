# STE rule 1.10
extends: existence
message: "ASD-STE100 1.10: '%[1]s' is slang. Use an approved word or the technical name. Keep it if it is a technical noun or verb of your field and no approved word has its meaning. Then add it to the vocabulary of your project, not to the Simplify vocabulary."
