# STE rule 9.3
extends: substitution
message: "ASD-STE100 9.3: Use %[1]s, not '%[2]s'. Keep '%[2]s' if it is a technical noun or verb of your field and %[1]s changes the meaning. Then add '%[2]s' to the vocabulary of your project, not to the Simplify vocabulary."
link: https://asd-ste100.org/
level: suggestion
scope: paragraph
ignorecase: true
exceptions:
